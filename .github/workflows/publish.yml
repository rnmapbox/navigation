name: Publish to NPM
on:
  release:
    types: [created]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for OIDC support
        # npm 12 requires node >= 22.22.2, newer than our .nvmrc; npm 11.5.1+ has OIDC support
        run: npm install -g npm@11
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build package
        run: yarn prepare
      - name: Publish package on NPM
        # Trusted publishing (OIDC) only authorizes `npm publish`, not `npm dist-tag`, so the tag is picked here.
        # Before 1.0 every release, prereleases included, goes to `latest`.
        run: |
          tag=latest
          if [ "$PRERELEASE" = true ] && [[ "$(node -p "require('./package.json').version")" != 0.* ]]; then
            tag=next
          fi
          npm publish --provenance --access public --tag "$tag"
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
  notify-failure:
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create issue about publish failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "npm publish failed for ${{ github.event.release.tag_name }}" \
            --body "The [Publish to NPM run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for release \`${{ github.event.release.tag_name }}\` failed. The package was not published to npm."
